name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # enablement turns Pages on if it is not already, so the first run does not fail
      # with "Get Pages site failed" before the setting has been switched by hand.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only the dashboard folder is published, so the site root is the dashboard
      # itself rather than a directory listing with no index page.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
